# ─────────────────────────────────────────────────────────────
# 모압매수 일일 주문 설정
# 매일 18:10 (평일) 이 파일 내용대로 미국주식 예약주문이 나갑니다.
#
# ※ 아래 종목/수량은 예시(placeholder)입니다. 반드시 본인 전략에 맞게 수정하세요.
#
# 각 항목:
#   symbol            : 티커
#   exchange          : NASD(나스닥) | NYSE(뉴욕) | AMEX(아멕스)
#   qty               : 주문 수량 (주)
#   price             : 지정가(USD). 비워두면(null) 현재가 기준 자동 계산
#   limit_offset_pct  : price 가 null 일 때 현재가 대비 % 오프셋
#                       (매수는 +0.5 처럼 살짝 높게, 매도는 -0.5 처럼 살짝 낮게
#                        걸어야 체결 확률이 올라갑니다)
# ─────────────────────────────────────────────────────────────

buy:
  - symbol: TQQQ
    exchange: NASD
    qty: 1
    price: null
    limit_offset_pct: 0.5
  - symbol: SOXL
    exchange: NASD
    qty: 1
    price: null
    limit_offset_pct: 0.5

sell:
  - symbol: TQQQ
    exchange: NASD
    qty: 1
    price: null
    limit_offset_pct: -0.5
  - symbol: SOXL
    exchange: NASD
    qty: 1
    price: null
    limit_offset_pct: -0.5
